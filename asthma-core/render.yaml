services:
  - type: web
    name: asthma-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DB_PATH
        value: data/asthma_v2.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_EXTRA_ORIGINS
        sync: false
